openapi: 3.1.0
info:
  title: SchwabGateway
  version: 0.2.0
  description: Internal market-data-only Schwab gateway; wire schema version 1.0.
servers:
  - url: http://schwab-gateway:8011
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayHealthV1"}
  /ready:
    get:
      operationId: ready
      responses:
        "200":
          description: Token manager is ready.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayReadinessV1"}
        "503":
          description: Token manager is not ready.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayReadinessV1"}
  /metrics:
    get:
      operationId: metrics
      responses:
        "200":
          description: Prometheus exposition.
          content:
            text/plain:
              schema: {type: string}
  /v1/quotes:
    get:
      operationId: quotesV1
      security: [{internalApiKey: []}]
      parameters:
        - in: query
          name: symbols
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200": {$ref: "#/components/responses/QuoteResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "504": {$ref: "#/components/responses/Error"}
  /v1/spot:
    get:
      operationId: spotV1
      security: [{internalApiKey: []}]
      parameters:
        - in: query
          name: symbol
          required: true
          schema: {$ref: "#/components/schemas/Symbol"}
      responses:
        "200": {$ref: "#/components/responses/SpotResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "504": {$ref: "#/components/responses/Error"}
  /v1/chain:
    get:
      operationId: chainV1
      security: [{internalApiKey: []}]
      parameters:
        - in: query
          name: symbol
          required: true
          schema: {$ref: "#/components/schemas/Symbol"}
        - in: query
          name: expiration
          required: true
          schema: {type: string, format: date}
      responses:
        "200": {$ref: "#/components/responses/ChainResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "504": {$ref: "#/components/responses/Error"}
  /v1/option-chain:
    get:
      operationId: optionChainV1
      description: >-
        Complete normalized contracts for one symbol and expiration. Responses are
        capped at 5000 contracts and fail closed rather than truncate.
      security: [{internalApiKey: []}]
      parameters:
        - in: query
          name: symbol
          required: true
          schema: {$ref: "#/components/schemas/Symbol"}
        - in: query
          name: expiration
          required: true
          schema: {type: string, format: date}
      responses:
        "200": {$ref: "#/components/responses/OptionChainResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "504": {$ref: "#/components/responses/Error"}
  /v1/history:
    get:
      operationId: historyV1
      security: [{internalApiKey: []}]
      parameters:
        - in: query
          name: symbol
          required: true
          schema: {$ref: "#/components/schemas/Symbol"}
        - in: query
          name: frequency
          required: false
          schema: {type: string, enum: [daily, minute], default: daily}
        - in: query
          name: days_back
          required: false
          schema: {type: integer, minimum: 1, maximum: 20}
      responses:
        "200": {$ref: "#/components/responses/HistoryResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "504": {$ref: "#/components/responses/Error"}
  /v1/movers:
    get:
      operationId: moversV1
      security: [{internalApiKey: []}]
      parameters:
        - in: query
          name: index
          required: true
          schema: {$ref: "#/components/schemas/MoverIndex"}
        - in: query
          name: direction
          required: false
          schema: {type: string, enum: [up, down], default: up}
      responses:
        "200": {$ref: "#/components/responses/MoversResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "504": {$ref: "#/components/responses/Error"}
  /v1/session-history:
    get:
      operationId: sessionHistoryV1
      security: [{internalApiKey: []}]
      parameters:
        - in: query
          name: symbol
          required: true
          schema: {$ref: "#/components/schemas/Symbol"}
        - in: query
          name: date
          required: true
          schema: {type: string, format: date}
        - in: query
          name: session
          required: true
          schema: {type: string, enum: [regular, extended]}
      responses:
        "200": {$ref: "#/components/responses/SessionHistoryResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "504": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-API-Key
  responses:
    QuoteResponse:
      description: Normalized quotes.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/QuoteResponseV1"}
    SpotResponse:
      description: Normalized spot value.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SpotResponseV1"}
    ChainResponse:
      description: Bounded chain metadata without contract rows.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ChainMetadataResponseV1"}
    OptionChainResponse:
      description: Complete normalized one-expiration chain, bounded to 5000 contracts.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OptionChainResponseV1"}
    HistoryResponse:
      description: Normalized daily or intraday price bars.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/HistoryResponseV1"}
    MoversResponse:
      description: Normalized index movers for one direction.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/MoversResponseV1"}
    SessionHistoryResponse:
      description: >-
        One trading session's 1-minute candles for one date, split using recurring
        US-equity holidays and scheduled 13:00 Eastern early closes.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SessionHistoryResponseV1"}
    Error:
      description: Bounded error.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/GatewayErrorV1"}
  schemas:
    SchemaVersion:
      type: string
      const: "1.0"
    Symbol:
      type: string
      pattern: "^[A-Z0-9$._/-]{1,32}$"
    AwareTimestamp:
      type: string
      format: date-time
    QualityFlags:
      type: array
      items: {type: string}
    GatewayHealthV1:
      type: object
      additionalProperties: false
      required: [schema_version, status, service, timestamp]
      properties:
        schema_version: {$ref: "#/components/schemas/SchemaVersion"}
        status: {type: string, enum: [ok, ready, not_ready]}
        service: {type: string, const: schwab-gateway}
        timestamp: {$ref: "#/components/schemas/AwareTimestamp"}
    GatewayReadinessV1:
      allOf:
        - {$ref: "#/components/schemas/GatewayHealthV1"}
        - type: object
          required: [token_state, reason]
          properties:
            token_state:
              type: string
              enum: [uninitialized, ready, refreshing, missing, corrupt, expired, revoked, reauthorization_required, lock_timeout, refresh_failed, persistence_failed]
            reason:
              type: string
              enum: [token_not_checked, token_ready, token_refreshing, token_missing, token_corrupt, refresh_token_expired, token_revoked, token_reauthorization_required, token_lock_timeout, token_refresh_failed, token_persistence_failed, token_readiness_unavailable]
    QuoteV1:
      type: object
      additionalProperties: false
      required: [symbol, event_timestamp, gateway_received_at, source, session, bid, ask, bid_size, ask_size, last, last_size, mark, volume, close, net_percent_change, stale, age_seconds, data_quality_flags]
      properties:
        symbol: {$ref: "#/components/schemas/Symbol"}
        event_timestamp: {anyOf: [{$ref: "#/components/schemas/AwareTimestamp"}, {type: "null"}]}
        gateway_received_at: {$ref: "#/components/schemas/AwareTimestamp"}
        source: {type: string}
        session: {type: [string, "null"]}
        bid: {type: [number, "null"]}
        ask: {type: [number, "null"]}
        bid_size: {type: [integer, "null"]}
        ask_size: {type: [integer, "null"]}
        last: {type: [number, "null"]}
        last_size: {type: [integer, "null"]}
        mark: {type: [number, "null"]}
        volume: {type: [integer, "null"]}
        close: {type: [number, "null"]}
        net_percent_change: {type: [number, "null"]}
        stale: {type: boolean}
        age_seconds: {type: [number, "null"], minimum: 0}
        data_quality_flags: {$ref: "#/components/schemas/QualityFlags"}
    QuoteResponseV1:
      type: object
      additionalProperties: false
      required: [schema_version, quotes]
      properties:
        schema_version: {$ref: "#/components/schemas/SchemaVersion"}
        quotes: {type: array, items: {$ref: "#/components/schemas/QuoteV1"}}
    SpotV1:
      type: object
      additionalProperties: false
      required: [symbol, price, event_timestamp, gateway_received_at, source, stale, age_seconds, data_quality_flags]
      properties:
        symbol: {$ref: "#/components/schemas/Symbol"}
        price: {type: [number, "null"]}
        event_timestamp: {anyOf: [{$ref: "#/components/schemas/AwareTimestamp"}, {type: "null"}]}
        gateway_received_at: {$ref: "#/components/schemas/AwareTimestamp"}
        source: {type: string}
        stale: {type: boolean}
        age_seconds: {type: [number, "null"], minimum: 0}
        data_quality_flags: {$ref: "#/components/schemas/QualityFlags"}
    SpotResponseV1:
      type: object
      additionalProperties: false
      required: [schema_version, spot]
      properties:
        schema_version: {$ref: "#/components/schemas/SchemaVersion"}
        spot: {$ref: "#/components/schemas/SpotV1"}
    ChainMetadataV1:
      type: object
      additionalProperties: false
      required: [symbol, expiration, underlying_price, call_contract_count, put_contract_count, strike_count, event_timestamp, gateway_received_at, source, stale, age_seconds, data_quality_flags]
      properties:
        symbol: {$ref: "#/components/schemas/Symbol"}
        expiration: {type: string, format: date}
        underlying_price: {type: [number, "null"]}
        call_contract_count: {type: integer, minimum: 0}
        put_contract_count: {type: integer, minimum: 0}
        strike_count: {type: integer, minimum: 0}
        event_timestamp: {anyOf: [{$ref: "#/components/schemas/AwareTimestamp"}, {type: "null"}]}
        gateway_received_at: {$ref: "#/components/schemas/AwareTimestamp"}
        source: {type: string}
        stale: {type: boolean}
        age_seconds: {type: [number, "null"], minimum: 0}
        data_quality_flags: {$ref: "#/components/schemas/QualityFlags"}
    ChainMetadataResponseV1:
      type: object
      additionalProperties: false
      required: [schema_version, chain]
      properties:
        schema_version: {$ref: "#/components/schemas/SchemaVersion"}
        chain: {$ref: "#/components/schemas/ChainMetadataV1"}
    OptionContractV1:
      type: object
      additionalProperties: false
      required: [symbol, option_type, expiration, strike, bid, ask, mark, last, total_volume, open_interest, volatility, delta, gamma, theta, vega, bid_size, ask_size, rho, intrinsic_value, time_value, in_the_money, days_to_expiration, multiplier, theoretical_option_value, event_timestamp, stale, age_seconds, data_quality_flags]
      properties:
        symbol: {type: string, minLength: 1}
        option_type: {type: string, enum: [CALL, PUT]}
        expiration: {type: string, format: date}
        strike: {type: number, exclusiveMinimum: 0}
        bid: {type: number, minimum: 0}
        ask: {type: number, minimum: 0}
        mark: {type: number, minimum: 0}
        last: {type: [number, "null"], minimum: 0}
        total_volume: {type: [integer, "null"], minimum: 0}
        open_interest: {type: [integer, "null"], minimum: 0}
        volatility: {type: [number, "null"]}
        delta: {type: [number, "null"]}
        gamma: {type: [number, "null"]}
        theta: {type: [number, "null"]}
        vega: {type: [number, "null"]}
        bid_size: {type: [integer, "null"], minimum: 0}
        ask_size: {type: [integer, "null"], minimum: 0}
        rho: {type: [number, "null"]}
        intrinsic_value: {type: [number, "null"]}
        time_value: {type: [number, "null"], minimum: 0}
        in_the_money: {type: [boolean, "null"]}
        days_to_expiration: {type: [integer, "null"], minimum: 0}
        multiplier: {type: [number, "null"]}
        theoretical_option_value: {type: [number, "null"]}
        event_timestamp: {anyOf: [{$ref: "#/components/schemas/AwareTimestamp"}, {type: "null"}]}
        stale: {type: boolean}
        age_seconds: {type: [number, "null"], minimum: 0}
        data_quality_flags: {$ref: "#/components/schemas/QualityFlags"}
    OptionChainV1:
      type: object
      additionalProperties: false
      required: [symbol, expiration, underlying_price, call_contract_count, put_contract_count, strike_count, contracts, event_timestamp, gateway_received_at, source, stale, age_seconds, data_quality_flags]
      properties:
        symbol: {$ref: "#/components/schemas/Symbol"}
        expiration: {type: string, format: date}
        underlying_price: {type: [number, "null"], exclusiveMinimum: 0}
        call_contract_count: {type: integer, minimum: 1}
        put_contract_count: {type: integer, minimum: 1}
        strike_count: {type: integer, minimum: 1}
        contracts:
          type: array
          minItems: 1
          maxItems: 5000
          items: {$ref: "#/components/schemas/OptionContractV1"}
        event_timestamp: {anyOf: [{$ref: "#/components/schemas/AwareTimestamp"}, {type: "null"}]}
        gateway_received_at: {$ref: "#/components/schemas/AwareTimestamp"}
        source: {type: string}
        stale: {type: boolean}
        age_seconds: {type: [number, "null"], minimum: 0}
        data_quality_flags: {$ref: "#/components/schemas/QualityFlags"}
    OptionChainResponseV1:
      type: object
      additionalProperties: false
      required: [schema_version, option_chain]
      properties:
        schema_version: {$ref: "#/components/schemas/SchemaVersion"}
        option_chain: {$ref: "#/components/schemas/OptionChainV1"}
    PriceBarV1:
      type: object
      additionalProperties: false
      required: [timestamp, open, high, low, close, volume]
      properties:
        timestamp: {$ref: "#/components/schemas/AwareTimestamp"}
        open: {type: number}
        high: {type: number}
        low: {type: number}
        close: {type: number}
        volume: {type: integer, minimum: 0}
    HistoryV1:
      type: object
      additionalProperties: false
      required: [symbol, frequency, bars, event_timestamp, gateway_received_at, source, stale, age_seconds, data_quality_flags]
      properties:
        symbol: {$ref: "#/components/schemas/Symbol"}
        frequency: {type: string, enum: [daily, minute]}
        bars: {type: array, items: {$ref: "#/components/schemas/PriceBarV1"}}
        event_timestamp: {anyOf: [{$ref: "#/components/schemas/AwareTimestamp"}, {type: "null"}]}
        gateway_received_at: {$ref: "#/components/schemas/AwareTimestamp"}
        source: {type: string}
        stale: {type: boolean}
        age_seconds: {type: [number, "null"], minimum: 0}
        data_quality_flags: {$ref: "#/components/schemas/QualityFlags"}
    HistoryResponseV1:
      type: object
      additionalProperties: false
      required: [schema_version, history]
      properties:
        schema_version: {$ref: "#/components/schemas/SchemaVersion"}
        history: {$ref: "#/components/schemas/HistoryV1"}
    MoverIndex:
      type: string
      enum: ["$DJI", "$COMPX", "$SPX", NYSE, NASDAQ, OTCBB, INDEX_ALL, EQUITY_ALL, OPTION_ALL, OPTION_PUT, OPTION_CALL]
    MoverV1:
      type: object
      additionalProperties: false
      required: [symbol, last_price, change, change_percent, volume]
      properties:
        symbol: {$ref: "#/components/schemas/Symbol"}
        last_price: {type: [number, "null"]}
        change: {type: [number, "null"]}
        change_percent: {type: [number, "null"]}
        volume: {type: [integer, "null"], minimum: 0}
    MoversV1:
      type: object
      additionalProperties: false
      required: [index, direction, movers, event_timestamp, gateway_received_at, source, stale, age_seconds, data_quality_flags]
      properties:
        index: {$ref: "#/components/schemas/MoverIndex"}
        direction: {type: string, enum: [up, down]}
        movers: {type: array, items: {$ref: "#/components/schemas/MoverV1"}}
        event_timestamp: {anyOf: [{$ref: "#/components/schemas/AwareTimestamp"}, {type: "null"}]}
        gateway_received_at: {$ref: "#/components/schemas/AwareTimestamp"}
        source: {type: string}
        stale: {type: boolean}
        age_seconds: {type: [number, "null"], minimum: 0}
        data_quality_flags: {$ref: "#/components/schemas/QualityFlags"}
    MoversResponseV1:
      type: object
      additionalProperties: false
      required: [schema_version, movers]
      properties:
        schema_version: {$ref: "#/components/schemas/SchemaVersion"}
        movers: {$ref: "#/components/schemas/MoversV1"}
    SessionHistoryV1:
      type: object
      additionalProperties: false
      required: [symbol, date, session, candles, event_timestamp, gateway_received_at, source, stale, age_seconds, data_quality_flags]
      properties:
        symbol: {$ref: "#/components/schemas/Symbol"}
        date: {type: string, format: date}
        session: {type: string, enum: [regular, extended]}
        candles: {type: array, items: {$ref: "#/components/schemas/PriceBarV1"}}
        event_timestamp: {anyOf: [{$ref: "#/components/schemas/AwareTimestamp"}, {type: "null"}]}
        gateway_received_at: {$ref: "#/components/schemas/AwareTimestamp"}
        source: {type: string}
        stale: {type: boolean}
        age_seconds: {type: [number, "null"], minimum: 0}
        data_quality_flags: {$ref: "#/components/schemas/QualityFlags"}
    SessionHistoryResponseV1:
      type: object
      additionalProperties: false
      required: [schema_version, session_history]
      properties:
        schema_version: {$ref: "#/components/schemas/SchemaVersion"}
        session_history: {$ref: "#/components/schemas/SessionHistoryV1"}
    GatewayErrorV1:
      type: object
      additionalProperties: false
      required: [schema_version, error]
      properties:
        schema_version: {$ref: "#/components/schemas/SchemaVersion"}
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}

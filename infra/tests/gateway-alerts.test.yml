rule_files:
  - ../alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'schwab_gateway_refresh_token_expires_timestamp_seconds{job="schwab_gateway",instance="soon"}'
        values: '3600+0x20'
      - series: 'schwab_gateway_refresh_token_expires_timestamp_seconds{job="schwab_gateway",instance="later"}'
        values: '172800+0x20'
      - series: 'schwab_gateway_refresh_token_expires_timestamp_seconds{job="schwab_gateway",instance="unknown"}'
        values: '0+0x20'
      - series: 'schwab_gateway_refresh_token_expires_timestamp_seconds{job="schwab_gateway",instance="expired"}'
        values: '1+0x20'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="SchwabGatewayRefreshTokenExpiring",alertstate="firing"}) or vector(0)'
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1
  - interval: 1m
    input_series:
      - series: 'schwab_gateway_scheduler_queue_wait_seconds_bucket{job="schwab_gateway",priority_class="protected",le="1"}'
        values: '0+0x20'
      - series: 'schwab_gateway_scheduler_queue_wait_seconds_bucket{job="schwab_gateway",priority_class="protected",le="2.5"}'
        values: '0+30x20'
      - series: 'schwab_gateway_scheduler_queue_wait_seconds_bucket{job="schwab_gateway",priority_class="protected",le="+Inf"}'
        values: '0+30x20'
      - series: 'schwab_gateway_scheduler_queue_wait_seconds_count{job="schwab_gateway",priority_class="protected"}'
        values: '0+30x20'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="SchwabGatewayProtectedQueueWaitHigh",alertstate="firing"}) or vector(0)'
        eval_time: 16m
        exp_samples:
          - labels: '{}'
            value: 1
  - interval: 1m

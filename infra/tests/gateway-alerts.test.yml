        values: '0+1x20'
      - series: 'schwab_gateway_scheduler_queue_wait_seconds_bucket{job="schwab_gateway",priority_class="protected",le="+Inf"}'
        values: '0+1x20'
      - series: 'schwab_gateway_scheduler_queue_wait_seconds_count{job="schwab_gateway",priority_class="protected"}'
        values: '0+1x20'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="SchwabGatewayProtectedQueueWaitHigh",alertstate="firing"}) or vector(0)'
        eval_time: 16m
        exp_samples:
          - labels: '{}'
            value: 0
  - interval: 1m

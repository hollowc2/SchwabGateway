# Deploys to /opt/monitoring/prometheus-alerts/schwab-gateway.yml, which is what the
# running butterfly_prometheus loads (`rule_files: /etc/prometheus/alerts/*.yml`).
# The repo's infra/prometheus.yml is NOT the live config -- the container binds
# /opt/monitoring/prometheus.yml -- so this rule cannot live alongside
# infra/candidate-alerts.yml and be seen.
#
# Requires the matching scrape job in /opt/monitoring/prometheus.yml:
#
#   - job_name: "schwab_gateway"
#     static_configs:
#       - targets: ["schwab-gateway:8011"]
#     metrics_path: /metrics
#
# /metrics is unauthenticated -- the auth middleware guards only /v1/ paths.
groups:
  - name: schwab-gateway
    rules:
      - alert: SchwabGatewayDown
        # The gateway is always-on (restart: unless-stopped). This rule is the reason
        # it is allowed to be: an always-on service with nothing watching it is how a
        # silently-dead gateway happens.
        expr: up{job="schwab_gateway"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Schwab gateway is down
          description: >-
            schwab_gateway_live has not been scrapeable for 2 minutes.
            Trading is unaffected -- no consumer depends on the gateway while
            SCHWAB_ACCESS_MODE and SCHWAB_GATEWAY_SHADOW_READS are at their defaults.

      - alert: SchwabGatewayNotReady
        # Require a successful scrape so process loss remains the Down alert's concern.
        # The 2-minute hold is deliberately longer than the 30-second token readiness
        # recovery interval, avoiding noise from one ordinary recovery cycle.
        expr: >-
          (up{job="schwab_gateway"} == 1)
          unless on(job, instance)
          (schwab_gateway_token_state{job="schwab_gateway", state="ready"} == 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Schwab gateway is running but not ready
          description: >-
            schwab_gateway_live has remained scrapeable without a ready
            token state for 2 minutes. Direct trading remains authoritative unless
            a separately approved gateway access-mode rollout changes that boundary.

      - alert: SchwabGatewayOptionChainEndToEndLatencyHigh
        # The scheduler's own upstream_execution histogram only covers time from
        # dispatch, not from HTTP-request-received -- a request that queues for
        # seconds behind other operation types on the single execution slot (see
        # scheduler.py's docstring) can still look fine on that metric alone. This
        # approximates true end-to-end latency as average queue wait + average
        # execution time per option-chain request, which is what actually determines
        # whether callers see fresh-enough data against the cache TTL. Recommended
        # threshold from the 2026-09 latency investigation (4.2-6.2s observed,
        # 4s TTL at the time) -- re-tune once a full trading session of
        # operation="option_chain" samples has accumulated.
        expr: >-
          (
            sum(rate(schwab_gateway_scheduler_queue_wait_seconds_sum{operation="option_chain"}[10m]))
            +
            sum(rate(schwab_gateway_scheduler_upstream_execution_seconds_sum{operation="option_chain"}[10m]))
          )
          /
          sum(rate(schwab_gateway_scheduler_upstream_execution_seconds_count{operation="option_chain"}[10m]))
          > 6
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Option-chain requests are averaging over 6s end-to-end
          description: >-
            Average queue wait plus execution time for option-chain requests has
            exceeded 6s for 10 minutes -- consistent with the scheduler queueing
            behavior traced in docs/runbooks (ButterflyGuy repo,
            schwab-gateway-option-chain-latency-investigation.md). Check
            schwab_gateway_scheduler_queue_wait_seconds by operation to see what is
            crowding the single execution slot.

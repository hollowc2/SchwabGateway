services:
  live:
    container_name: schwab_gateway_candidate
    environment:
      SCHWAB_GATEWAY_PORT: 8012
    ports: !override
      - "127.0.0.1:8012:8012"
    networks:
      monitoring_net:
        aliases: !override
          - schwab-gateway-candidate
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8012/ready', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

[project]
name = "schwab-gateway-sdk"
version = "0.4.4"
description = "Versioned models and async client for SchwabGateway"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schwab_gateway_sdk"]

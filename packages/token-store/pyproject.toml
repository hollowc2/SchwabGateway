[project]
name = "schwab-token-store"
version = "0.2.0"
description = "Atomic locked Schwab OAuth token storage"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.21.0",
    "structlog>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schwab_token_store"]

[project]
name = "schwab-gateway"
version = "0.3.0"
description = "Internal read-only Schwab market-data gateway"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.4",
    "prometheus-client>=0.21.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "schwab-gateway-sdk",
    "schwab-py>=1.4.0",
    "schwab-token-store",
    "structlog>=24.0.0",
]

[project.scripts]
schwab-gateway = "schwab_gateway.runner:main"
schwab-gateway-issue-keys = "schwab_gateway.issue_keys:main"
schwab-gateway-probe-credentials = "schwab_gateway.probe_credentials:main"
schwab-gateway-capture-order-books = "schwab_gateway.capture_order_books:main"
schwab-gateway-derive-order-books = "schwab_gateway.derive_order_books:main"
schwab-gateway-catalog-order-books = "schwab_gateway.catalog_order_books:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schwab_gateway"]

[tool.hatch.build.targets.sdist]
exclude = ["/.env", "/.env.*", "/.git", "/.venv", "/dist", "/evidence", "/secrets", "**/tokens.json", "**/credentials.json"]

[tool.uv.workspace]
members = ["packages/sdk", "packages/token-store"]

[tool.uv.sources]
schwab-gateway-sdk = { workspace = true }
schwab-token-store = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "build>=1.2.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0.0",
    "ruff>=0.8.0",
]
